name: construwx

networks:
  construwx-net:
    driver: bridge

services:

  mariadb:
    image: mariadb:11
    container_name: construwx-mariadb
    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - .env

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}

    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./config/mariadb:/etc/mysql/conf.d

    networks:
      - construwx-net

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: construwx-redis
    restart: unless-stopped

    env_file:
      - .env

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}

    volumes:
      - ./data/redis:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    networks:
      - construwx-net

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  php:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: construwx-php

    restart: unless-stopped
    init: true

    env_file:
      - .env

    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./data/wordpress:/var/www/html
      - ./config/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./config/wordpress:/config:ro

    networks:
      - construwx-net
  wpcli:
    image: wordpress:cli-php8.3

    container_name: construwx-wpcli

    profiles:
      - tools

    depends_on:
      mariadb:
        condition: service_healthy
      php:
        condition: service_started

    env_file:
      - .env

    volumes:
      - ./data/wordpress:/var/www/html

    working_dir: /var/www/html

    networks:
      - construwx-net

    entrypoint: ["wp"]
  nginx:
    image: nginx:1.28-alpine

    container_name: construwx-nginx

    restart: unless-stopped

    depends_on:
      - php

    volumes:
      - ./data/wordpress:/var/www/html:ro
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    expose:
      - "80"

    networks:
      - construwx-net

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 10