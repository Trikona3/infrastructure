name: nginx-proxy-manager

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - construwx_edge

volumes:
  npm_data:
  npm_letsencrypt:

networks:
  construwx_edge:
    name: construwx_edge
    external: true
